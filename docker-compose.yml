version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: insurance-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - insurance-net

  backend:
    build: ./backend
    container_name: insurance-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/insurance_demo
    depends_on:
      - mongodb
    networks:
      - insurance-net

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api   # relative path
    container_name: insurance-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - insurance-net

volumes:
  mongo-data:

networks:
  insurance-net:
    driver: bridge